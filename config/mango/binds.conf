# Key bindings (mirrors hypr/binds.conf; actions ported from niri [binds]).
#
# Format: bind=MODIFIERS,KEY,DISPATCHER[,ARGS]  (`spawn` runs a command,
# `spawn_shell` runs it through sh, so pipes work). Modifiers combine with
# `+` (SUPER+SHIFT, CTRL+ALT, …); `NONE` = no modifier.
#
# niri -> mango concept map: workspaces -> tags (view/tag 1-9),
# columns/windows -> focusdir/exchange_client, column-width presets ->
# scroller_proportion_preset, overview -> toggleoverview.
# Binds with no mango 0.16.3 equivalent are listed under "Not ported" in
# README.md instead of being silently dropped.

# Reload / overview / close / quit (niri hotkey-overlay has no equivalent;
# its Mod+SHIFT+slash slot reloads the config, like upstream mango's SUPER+r).
bind=SUPER+SHIFT,slash,reload_config
bind=SUPER,space,toggleoverview
bind=SUPER,x,killclient
bind=SUPER+SHIFT,x,killclient,force
bind=SUPER+SHIFT,e,quit
bind=SUPER+ALT,p,sleep_toggle_monitor,eDP-1

# Applications (niri "Applications" block; helper scripts are shared with
# niri via ~/.config/niri/).
bind=SUPER,Return,spawn,kitty --single-instance
bind=SUPER,b,spawn,firefox-beta
bind=SUPER,e,spawn,nautilus
bind=SUPER,i,spawn,~/.config/niri/my-bookmark list
bind=SUPER,m,spawn_shell,ecr
bind=SUPER,o,spawn,~/.config/niri/my-commands
bind=SUPER,s,spawn,kitten quick-access-terminal
bind=SUPER+SHIFT,b,spawn,qutebrowser
bind=SUPER+SHIFT,i,spawn,~/.config/niri/my-bookmark commands
bind=SUPER+ALT,k,spawn,pkill -SIGUSR1 -f gpu-screen-recorder
bind=SUPER+ALT,r,spawn,~/.config/niri/my-recorder commands

# Noctalia (`noctalia msg …` form, as in the niri config).
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,q,spawn,noctalia msg panel-toggle session
bind=SUPER,comma,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,s,spawn,noctalia msg settings-toggle
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle session

# Screenshots (niri used grim+satty+tesseract; same tools here).
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | satty -f -
bind=CTRL,Print,spawn,grim - | satty -f -
bind=ALT,Print,spawn_shell,grim -g "$(slurp)" - | satty -f -
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" -t ppm - | tesseract - - | wl-copy

# Media / special keys.
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86Display,spawn,nwg-displays
bind=NONE,XF86Calculator,spawn,qalculate-gtk
bind=SUPER,F6,spawn,brightnessctl -d tpacpi::kbd_backlight set +1
bind=SUPER,F5,spawn,brightnessctl -d tpacpi::kbd_backlight set 1-

# Focus windows (niri Mod+J/K = focus-window-or-workspace).
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focus_window_or_workspace,down
bind=SUPER,k,focus_window_or_workspace,up

# Move windows (niri move-column/move-window; mango swaps via exchange_client).
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up

# Tags, like workspaces (view = focus, tag = move window there).
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER+SHIFT,Page_Down,tagtoright,0
bind=SUPER+SHIFT,Page_Up,tagtoleft,0
bind=SUPER,Home,view,1,0
bind=SUPER,End,view,9,0
bind=SUPER+SHIFT,Home,tag,1,0
bind=SUPER+SHIFT,End,tag,9,0
bind=SUPER,n,viewtoright,0
bind=SUPER,p,viewtoleft,0
bind=SUPER+SHIFT,n,tagtoright,0
bind=SUPER+SHIFT,p,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,Tab,view,-1,0

# Monitors.
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Down,focusmon,down
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# Scroller stack in/out (niri consume-or-expel-window).
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# Size presets and window state (niri Mod+R column-width presets).
bind=SUPER,r,switch_proportion_preset
bind=SUPER+SHIFT,r,set_proportion,1.0
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,c,centerwin
bind=SUPER+CTRL,c,centerwin
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05
bind=SUPER,v,togglefloating

# Layout switching (no niri counterpart — niri is always scrolling).
bind=SUPER+CTRL,t,setlayout,tile
bind=SUPER+CTRL,s,setlayout,scroller
bind=SUPER+CTRL,n,switch_layout

# Mouse / wheel (niri wheel binds scrolled workspaces/columns with 150 ms
# cooldown; mango rate-limits axis binds via axis_bind_apply_timeout).
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=ALT,UP,focusdir,left
axisbind=ALT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,exchange_client,right
