# Appearance (mirrors hypr/appearance.conf; values follow niri [layout],
# focus-ring/border/shadow/blur and hypr general/decoration where niri is
# silent).

# Gaps: niri `gaps 10`; hypr gaps_in 3 / gaps_out 10.
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Border: niri focus-ring width 2, active #7fc8ff, inactive #505050
# (niri border section is `off`, so the ring is the only outline).
border_px=2
border_color=0x505050ff
focus_color=0x7fc8ffff
root_color=0x201b14ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0xBABD2Cff
urgent_color=0x9b0000ff
scratchpad_color=0xc4939dff
global_color=0x8d64cfff
overlay_color=0x95C381ff

# Shape/opacity: niri geometry-corner-radius 10, opacity 0.85
# (0.95 when focused); hypr rounding 5 is superseded by niri's 10.
border_radius=10
no_radius_when_single=0
unfocused_opacity=0.85
focused_opacity=0.95

# Blur: niri blur passes 1, offset 3.0, noise 0.03, saturation 1.0
# (niri blurs everything without xray; mango blurs globally here).
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=3
blur_params_noise=0.03
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Shadow: niri softness 30, spread 5, offset 0x5, color #0007.
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadows_color=0x00000077

# Animations: niri leaves them on (defaults); durations/curves are mango
# stock, matching the snappy hypr myBezier feel closely enough.
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller layout (niri's column model): niri default-column-width 0.5,
# preset widths 1/3-1/2-2/3, center-focused-column "never".
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# Master-stack (tile) defaults.
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle defaults.
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview (niri Mod+Space; see binds.conf).
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc behaviour.
no_border_when_single=0
axis_bind_apply_timeout=150
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=0
warp_cursor=0
focus_cross_monitor=0
focus_direction_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_hide_timeout=0
drag_tile_to_tile=1
drag_tile_small=1
single_scratchpad=1
circle_layout=tile,scroller
xwayland_persistence=1
allow_tearing=1
