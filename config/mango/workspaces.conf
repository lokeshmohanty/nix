# Tags/workspaces (mirrors hypr/workspaces.conf).
#
# niri uses dynamic workspaces; mango tags are fixed 1-9. The default layout
# is scroller — the closest match to niri's scrolling columns. Per-tag
# overrides are possible, e.g.:
#   tagrule=id:2,layout_name:tile
#   tagrule=id:5,layout_name:monocle
# (also available: grid, deck, center_tile, vertical_tile,
# vertical_scroller).

tagrule=id:*,layout_name:scroller
