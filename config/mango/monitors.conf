# Monitors (mirrors hypr/monitors.conf; geometry from niri [[output]] blocks).
#
# niri config: eDP-1 1920x1080 @ 0,0; DP-1 and HDMI-A-1 1920x1080 @ -1920,0.
# Mango/XWayland mis-handles negative coordinates (clicks break), so the
# layout is shifted to x >= 0 keeping the same left-to-right order: the
# external output sits left (x=0), the laptop panel right (x=1920).
# DP-1 and HDMI-A-1 are alternatives for the single external port, hence the
# same position. niri transform "normal" is mango's default (omitted).

monitor_rule=name:^DP-1$,width:1920,height:1080,x:0,y:0,scale:1,refresh:60
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,x:0,y:0,scale:1,refresh:60

monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1
