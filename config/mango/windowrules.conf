# Window rules (mirrors hypr/windowrules.conf; conditions from niri
# window-rules + hypr/windowrules.conf).
#

# niri: float dialogs, file pickers, PiP and the calculator.
window_rule=is_floating:1,title:^(nwg-displays|Open File|satty|Picture-in-Picture|Qalculate!)$

# niri: camera-overlay floats (app-id and title must both match).
window_rule=is_floating:1,app_id:camera-overlay,title:camera-overlay

# niri: Noctalia settings window floats at 1080x920.
window_rule=is_floating:1,width:1080,height:920,app_id:dev.noctalia.Noctalia

# hypr: keep picture-in-picture on top.
window_rule=is_overlay:1,title:^Picture-in-Picture$

# Terminal swallowing (dwm-style): kitty spawns replace transient children,
# flameshot/satty never get swallowed.
window_rule=is_term:1,app_id:kitty
window_rule=no_swallow:1,app_id:flameshot

# Browsers keep their own size negotiation (hypr used force-fake-maximize).
window_rule=is_fake_fullscreen:1,app_id:firefox

# Layer rules: keep screenshot selection layers effect-free (avoids ghosting),
# zoom animation for the rofi launcher.
layer_rule=no_blur:1,no_shadow:1,layer_name:selection
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
