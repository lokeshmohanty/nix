# Window rules (mirrors hypr/windowrules.conf; conditions from niri
# window-rules + hypr/windowrules.conf).
#
# 0.16.3 spelling is `windowrule=`/`layerrule=` with mostly
# underscore-free option names (appid, isfloating, isoverlay, noblur,
# noshadow, …). A few keep underscores: animation_type_open,
# animation_type_close, focused_opacity, unfocused_opacity, force_tearing,
# layer_name.

# niri: float dialogs, file pickers, PiP and the calculator.
windowrule=isfloating:1,title:^(nwg-displays|Open File|satty|Picture-in-Picture|Qalculate!)$

# niri: camera-overlay floats (app-id and title must both match).
windowrule=isfloating:1,appid:camera-overlay,title:camera-overlay

# niri: Noctalia settings window floats at 1080x920.
windowrule=isfloating:1,width:1080,height:920,appid:dev.noctalia.Noctalia

# hypr: keep picture-in-picture on top.
windowrule=isoverlay:1,title:^Picture-in-Picture$

# Terminal swallowing (dwm-style): kitty spawns replace transient children,
# flameshot/satty never get swallowed.
windowrule=isterm:1,appid:kitty
windowrule=noswallow:1,appid:flameshot

# Browsers keep their own size negotiation (hypr used force-fake-maximize).
windowrule=isfakefullscreen:1,appid:firefox

# Layer rules: keep screenshot selection layers effect-free (avoids ghosting),
# zoom animation for the rofi launcher.
layerrule=noblur:1,noshadow:1,layer_name:selection
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
