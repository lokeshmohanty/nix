# Mango configuration — entry point (role of hypr/hyprland.conf).
#
# Split files mirror config/hypr/*.conf; values follow config/niri/config.kdl.
#
# Validate without starting mango:
#   mango -c ~/.config/mango/config.conf -p
# Hot-reload a running mango:
#   SUPER+SHIFT+slash (see binds.conf)
#
# Key spellings target mango 0.18.4 (upstream renamed the hyprland-style
# keys to snake_case, e.g. `windowrule` -> `window_rule`; re-validate
# every key with `mango -p` after a version bump).

env=XCURSOR_SIZE,24
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=NIXOS_OZONE_WL,1

exec_once=noctalia
exec_once=kitty --single-instance --start-as=hidden

source=~/.config/mango/appearance.conf
source=~/.config/mango/input.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/workspaces.conf
source=~/.config/mango/windowrules.conf
source=~/.config/mango/binds.conf
