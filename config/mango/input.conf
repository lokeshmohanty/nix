# Input (niri [input] section ported to mango key names).
#
# niri reference: keyboard xkb unset, numlock on; touchpad tap on,
# natural-scroll on, accel-speed 0.8 (dwt/drag-lock commented out = off);
# mouse accel-speed 0.8, no natural-scroll.

# Keyboard (hypr kb_layout=us agrees with the niri default here).
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0.8
trackpad_disable_while_typing=0
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse.
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.8
